name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.24', '1.25', '1.26']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race detector and coverage
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.go-version == '1.26'
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.26']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build binary
        run: go build -o gow ./cmd/gow

      - name: Build artisan
        run: go build -o artisan ./cmd/artisan

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gow-${{ matrix.os }}
          path: |
            gow
            gow.exe
            artisan
            artisan.exe

  smoke-test:
    name: Scaffolding Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build gow
        run: go build -o gow ./cmd/gow

      - name: Smoke test gow new (minimal)
        run: |
          ./gow new smoke-min --minimal --yes --no-git
          cd smoke-min
          go build ./...
          echo "Minimal kit builds successfully"

      - name: Smoke test gow new (auth)
        run: |
          ../gow new smoke-auth --auth --yes --no-git
          cd smoke-auth
          go build ./...
          echo "Auth kit builds successfully"
